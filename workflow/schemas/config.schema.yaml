$schema: "https://json-schema.org/draft/2020-12/schema"
description: Snakemake configuration file
type: object
properties:
  sample_table:
    type: string
    default: "config/samples.tsv"
    description: >
      Path to the sample metadata TSV. Must contain columns: sample_name,
      sample_type (csrna|input), read_r1. Optional: replicate (integer,
      default 1), read_r2 (blank for single-end), input_name (on csRNA rows,
      the sample_name of the input library to pair with; defaults to the
      row's own sample_name). Comma-separate multiple FASTQ paths in a
      single cell.
  chrom_sizes:
    type: string
    description: >
      Path to a two-column (chrom, size) TSV without a header. Only
      chromosomes listed here are kept in merged TSSs, consensus TSSs, and
      bigWig tracks; omit organelle chromosomes (e.g. Mt, Pt) from this
      file to exclude them from the analysis.
  genome_fasta:
    type: string
    description: >
      Path to the reference genome FASTA. Used only to build an alignment
      index when genome_index does not yet exist. If genome_index already
      exists, this key is optional.
  program:
    type: object
    properties:
      genome_index:
        type: string
        description: >
          Path to the pre-built genome index for the selected
          alignment_program (bwa, STAR, bowtie2, or hisat2 index).
      bfqutils:
        type: object
        properties:
          sequencing_adapter:
            type: string
            default: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
            description: >
              3′ adapter sequence to trim from reads. Default is the
              standard Illumina TruSeq adapter.
          use_pigz:
            type: boolean
            default: False
            description: >
              Use pigz (parallel gzip) instead of gzip for compressing
              trimmed FASTQ. Speeds up the trim step on multi-core machines.
          pigz_threads:
            type: integer
            default: 4
            description: >
              Number of pigz compression threads. Only used when use_pigz
              is true. Capped automatically to leave at least two threads
              for bfqutils itself.
      alignment_threads:
        type: integer
        default: 1
        description: >
          Number of threads allocated to each alignment job. Minimum
          effective value is 2 (samtools sort runs concurrently). Increase
          to speed up alignment at the cost of running fewer jobs in parallel.
      alignment_program:
        enum:
          - "bwa-aln"
          - "bwa-mem"
          - "STAR"
          - "bowtie2"
          - "hisat2"
        default: "bwa-aln"
        description: >
          Read aligner to use. bwa-aln is recommended and is the only
          aligner fully tested with the pipeline. STAR, bowtie2, and
          hisat2 support is implemented but not yet validated.
      keep_trimmed_fastq:
        type: boolean
        default: True
        description: >
          Retain trimmed FASTQ files after alignment. Set to false to mark
          them as temporary so Snakemake deletes them once they are no
          longer needed, saving disk space.
      keep_bam:
        type: boolean
        default: True
        description: >
          Retain sorted BAM files after HOMER tag directory creation. Set
          to false to have Snakemake delete them automatically.
      keep_unmapped_sample:
        type: integer
        minimum: 0
        default: 0
        description: >
          When above zero, keep this many reads that never aligned per
          library, as qc/<sample>.unmapped.sample.fastq.gz. Two thirds of a
          csRNA-seq library can be lost at alignment, and with keep_bam and
          keep_trimmed_fastq off none of it survives the run, so a
          contaminant screen or a low-complexity check afterwards means
          aligning again. A few hundred thousand reads costs a few MB and
          answers the question. Default 0 writes nothing. See
          keep_below_mapq_sample for the reads that did align but were then
          discarded, which is a different question.
      keep_below_mapq_sample:
        type: integer
        minimum: 0
        default: 0
        description: >
          When above zero, keep this many reads that aligned but fell below
          alignment_mapq per library, as
          qc/<sample>.belowmapq.sample.fastq.gz. With bwa, MAPQ 0 means the
          read placed equally well somewhere else, so this is the
          multi-mapping fraction, and in Arabidopsis the obvious suspect is
          the rDNA arrays that TAIR12 assembles as thousands of rRNA gene
          copies. That makes this the more informative of the two samples
          when the question is where a large alignment loss went, since
          BelowMapqReads is usually the bigger class. Kept separate from the
          unmapped sample on purpose: the two have opposite implications and
          mixing them would discard the distinction the counts exist to
          draw. Sequences are written as sequenced, reverse-complemented
          back where the alignment was on the reverse strand. Default 0
          writes nothing.
      bwa_aln:
        type: object
        properties:
          keep_sai:
            type: boolean
            default: True
            description: >
              Retain the intermediate .sai file produced by bwa aln. Set to
              false to delete it automatically after alignment.
      bwa_mem:
        type: object
        properties:
          w:
            type: integer
            default: 0
            description: >
              Band width for Smith-Waterman alignment (-w). Set to 0 to
              disable gapped alignment, which is appropriate for short
              csRNA-seq reads.
          L:
            type: integer
            default: 999
            description: >
              Clipping penalty (-L). High value discourages soft-clipping,
              ensuring reads align end-to-end.
          O:
            type: integer
            default: 999
            description: >
              Gap open penalty (-O). High value discourages gapped
              alignments, appropriate for short csRNA-seq reads.
      bowtie2:
        type: object
        properties:
          extra_params:
            type: string
            default: "--very-sensitive"
            description: Additional command-line flags passed to bowtie2.
      hisat2:
        type: object
        properties:
          extra_params:
            type: string
            default: "--very-sensitive"
            description: Additional command-line flags passed to hisat2.
      star:
        type: object
        properties:
          read_files_command:
            type: string
            default: "zcat"
            description: >
              Command used by STAR to decompress input FASTQ
              (--readFilesCommand). Use "zcat" for .gz files.
          align_ends_type:
            type: string
            default: "EndToEnd"
            description: >
              STAR end-to-end vs local alignment mode
              (--alignEndsType). EndToEnd is recommended for csRNA-seq.
          align_intron_max:
            type: integer
            default: 1
            description: >
              Maximum intron length (--alignIntronMax). Set to 1 to
              suppress spliced alignments, appropriate for unspliced
              csRNA-seq reads.
          out_filter_multimap_nmax:
            type: integer
            default: 1000
            description: >
              Maximum number of loci a read may map to before being
              discarded (--outFilterMultimapNmax). Multimappers are
              subsequently removed by the MAPQ filter.
          genome_sa_index_nbases:
            type: integer
            default: 14
            description: >
              Length of the SA pre-indexing string (--genomeSAindexNbases)
              used when building the STAR index. For small genomes, use
              min(14, floor(log2(genome_size) / 2 - 1)): e.g. 12 for
              Arabidopsis (~135 Mb), 11 for a ~30 Mb fungal genome. STAR
              will emit a warning if the default 14 is too large.
      homer:
        type: object
        properties:
          genome:
            type: string
            description: >
              HOMER genome name (e.g. tair10, hg38). Must match a genome
              already configured in your HOMER installation.
          tagdir:
            type: object
            properties:
              extra_args:
                type: string
                default: ""
                description: >
                  Extra arguments passed to bam2td (e.g. -mapq, -tbp).
          tss:
            type: object
            properties:
              size:
                type: integer
                default: 100
                description: >
                  Window size (bp) around each TSS used by
                  findcsRNATSS.pl (-size). Smaller windows give higher
                  resolution but may miss broad initiation regions.
              ntagthreshold:
                type: integer
                default: 5
                description: >
                  Minimum number of tags (reads) required to call a TSS
                  (-ntagThreshold). Increase to reduce noise at the cost
                  of sensitivity.
              extra_args:
                type: string
                default: "-includeSingleExons"
                description: >
                  Extra arguments passed to findcsRNATSS.pl.
                  -includeSingleExons retains TSSs on single-exon genes
                  that HOMER would otherwise filter.
              gtf:
                type: string
                default: ""
                description: >
                  Optional gene annotation GTF passed to HOMER as -gtf. Without
                  it (and without a HOMER genome that carries its own
                  annotation) HOMER cannot build the annotated-TSS / exon
                  true-positive and false-positive sets it uses to choose the
                  enrichment threshold per library, and silently falls back to
                  default_log2_fold; the promoter-distal and stable-transcript
                  columns are then written as placeholders (100.00% / 0.00%).
                  Supplying a GTF is the single largest quality lever available
                  here, but it changes TSS calls, so compare against your
                  existing consensus before adopting it. Empty means no
                  annotation, which is the previous behaviour.
              program:
                type: string
                enum: ["findcsRNATSS.pl", "findcsRNATSR.pl"]
                default: "findcsRNATSS.pl"
                description: >
                  Which HOMER TSS caller to run. findcsRNATSS.pl prints "this
                  program is a legacy placeholder - please use findcsRNATSR.pl
                  instead", and the two are the same program: their tables are
                  identical (verified on a 34,891-cluster library, zero differing
                  rows), differing only in output file names and labels, which
                  this pipeline normalises. The default stays on the legacy name
                  because findcsRNATSR.pl ships with an unpatched "use lib"
                  pointing at the author's own install, so it resolves
                  HomerConfig only when HOMER's bin directory is on PERL5LIB.
                  Check that inside your container before switching.
              pseudo_count:
                type: number
                default: 1.0
                description: >
                  HOMER -pseudoCount: normalised reads added to both sides of the
                  enrichment ratio. This is what lets a cluster with zero input
                  coverage pass automatically, since log2((cs+1)/(0+1)) is large
                  by construction. Raise it to demand real input coverage before
                  believing an enrichment. Default matches HOMER's own.
              default_log2_fold:
                type: number
                default: 1
                description: >
                  HOMER -defaultLog2Fold: the enrichment threshold used when the
                  annotation-based threshold calculation cannot run, which is the
                  case whenever no GTF or annotated genome is supplied. With no
                  annotation this is therefore the threshold that is actually in
                  force. Default matches HOMER's own (2-fold).
              local_fold:
                type: number
                default: 2
                description: >
                  HOMER -L: local fold enrichment required during initial TSS
                  identification. Default matches HOMER's own.
          required:
            - genome
    required:
      - genome_index
      - homer
  filtering:
    type: object
    properties:
      alignment_mapq:
        type: integer
        default: 30
        description: >
          Minimum MAPQ score for a read to be retained after alignment.
          MAPQ 30 corresponds to a 0.1% probability of the read being
          misplaced.
      exclude_flags:
        type: integer
        default: 2308
        description: >
          SAM FLAG bits to exclude (samtools view -F). Default 2308 removes
          unmapped reads (4), secondary alignments (256), and supplementary
          alignments (2048).
      include_flags:
        type: integer
        default: 0
        description: >
          SAM FLAG bits that must be set (samtools view -f). Default 0
          means no mandatory flags. Set to 2 to require properly paired
          reads when using paired-end data.
      max_read_length:
        type: integer
        default: 70
        description: >
          Maximum read length (bp) retained after trimming. Reads longer
          than this are hard-clipped. 70 bp is appropriate for csRNA-seq
          to avoid multi-mapper artefacts.
      min_alignment_length:
        type: integer
        default: 15
        description: >
          Minimum aligned read length (bp) retained after alignment. Removes
          very short alignments that are more likely to be artefactual.
      max_mismatch:
        type: integer
        default: 999
        description: >
          Maximum number of mismatches (NM tag) allowed in an alignment.
          Default 999 effectively disables this filter. Lower values impose
          stricter mapping specificity.
      tss_min_reps:
        type: integer
        default: 1
        description: >
          Minimum number of replicates in which a TSS must be detected to
          be included in the final consensus set. Set to 1 to keep all
          TSSs regardless of reproducibility; increase for stricter
          reproducibility filtering.
      tss_min_cpm:
        type: number
        default: 0
        description: >
          Minimum CPM (counts per million library-size reads) a TSS must
          have in a csRNA sample to count as "expressed" in that sample.
          A TSS is kept in tss.final.bed only if it clears this threshold
          in at least tss_min_samples csRNA samples. Default 0 disables
          the filter (every TSS clears 0 CPM in every sample).
      tss_min_samples:
        type: integer
        default: 1
        description: >
          Minimum number of csRNA samples that must have CPM ≥ tss_min_cpm
          for a TSS to be retained in tss.final.bed. Has no effect when
          tss_min_cpm is 0.
      tss_min_cs_in_ratio:
        type: number
        default: 0
        description: >
          Minimum csRNA/input read ratio for a TSS to count as "expressed"
          in a sample. A TSS is kept only if this ratio is met in at least
          tss_min_ratio_samples csRNA samples. Default 0 disables the filter.
      tss_min_ratio_samples:
        type: integer
        default: 1
        description: >
          Minimum number of csRNA samples that must have csRNA/input ratio
          >= tss_min_cs_in_ratio for a TSS to be retained. Has no effect
          when tss_min_cs_in_ratio is 0.
      tss_srna_sizes:
        type: array
        items:
          type: integer
        default: []
        description: >
          Read lengths (nt) treated as uncapped small RNA classes when judging
          the read-size composition of a TSS cluster, e.g. [21, 22, 23, 24, 25]
          for plant siRNAs (the 24 nt Pol IV class over transposons being the
          usual offender). A TSS is dropped from tss.final.bed when more than
          tss_max_srna_fraction of its reads fall in these sizes. Default []
          disables the filter, and when empty the tss_size_composition rule
          does not read the tag directories at all.
      tss_max_srna_fraction:
        type: number
        minimum: 0
        maximum: 1
        default: 0.5
        description: >
          Maximum fraction of a TSS cluster's reads allowed to fall in
          tss_srna_sizes before the cluster is treated as small-RNA derived and
          dropped. Has no effect when tss_srna_sizes is empty.
      tss_top_sizes_n:
        type: integer
        minimum: 1
        default: 2
        description: >
          How many of a TSS cluster's commonest read lengths the top-lengths
          filter adds up. Genuine initiation is heterogeneous, spreading reads
          over tens of lengths, so its two commonest lengths hold only about a
          fifth of a protein-coding cluster. A discretely processed RNA puts
          nearly everything into one or two. Only used when
          tss_max_top_sizes_fraction is below 1.
      tss_max_top_sizes_fraction:
        type: number
        minimum: 0
        maximum: 1
        default: 1
        description: >
          Maximum fraction of a TSS cluster's reads allowed to fall in its
          tss_top_sizes_n commonest read lengths before the cluster is treated
          as a discretely processed RNA rather than a transcription start site,
          and dropped. Default 1 disables the filter (no concentration is too
          high). 0.8 with tss_top_sizes_n 2 is a good starting point: measured
          on Arabidopsis csRNA-seq it flags 0.09% of protein-coding clusters and
          17% of transposon clusters. Unlike tss_srna_sizes this needs no prior
          knowledge of which lengths are contaminating, so it catches species
          outside the usual small RNA sizes.
      tss_srna_min_reads:
        type: integer
        default: 100
        description: >
          Minimum reads a csRNA library must have in a cluster before that
          library's size composition is allowed to judge it. Libraries below the
          threshold do not vote, so a handful of stray reads cannot remove a
          cluster. Gates both size-composition filters (tss_srna_sizes and
          tss_max_top_sizes_fraction). Size composition is estimated from few
          reads at weakly expressed clusters, so a low floor costs specificity:
          the top-lengths flag rate runs 2.4% at 30-50 reads per cluster against
          0.1-0.3% above 300. Real single-locus contaminants are usually very
          abundant, so 100 keeps them while dropping most of the small-sample
          noise. Lower it to around 30 if you would rather be sensitive.
      tss_srna_min_samples:
        type: integer
        default: 1
        description: >
          Number of csRNA libraries that must find a cluster size-dominated for
          it to be dropped. The default of 1 removes a cluster flagged by
          any single library, which is the sensitive choice when libraries
          differ in size selection (a 40-80 nt library cannot see a 24 nt
          population that a 20-80 nt library shows plainly). Raise it to demand
          agreement across libraries. Gates both size-composition filters
          (tss_srna_sizes and tss_max_top_sizes_fraction).
      exclude_failed_from_consensus:
        type: boolean
        default: False
        description: >
          Drop csRNA libraries whose initial QC Status is FAIL (csFRiP below
          min_cs_frip or nuclear percentage below min_pct_nuclear) from the
          consensus TSS union. Default False, which keeps the previous behaviour
          of building the union from every csRNA library regardless of QC. Worth
          enabling because the union is a union: a contaminated library injects
          its own spurious clusters into the shared set, and everything
          downstream then quantifies them. A warning is printed either way when a
          FAIL library contributes.
      tss_top_sizes_max:
        type: integer
        minimum: 1
        default: 5
        description: >
          Highest n for which the tss_size_composition rule precomputes the
          top-n read-length share. tss_top_sizes_n can then be retuned anywhere
          in 1..this without re-reading the tag directories. Raising it costs one
          extra column per library per n; a full per-cluster length histogram
          would be exact for any n but runs to tens of millions of rows on a
          plant-sized dataset, which is why only the cumulative top-n sums are
          kept.
      mask_srnas_from_bw:
        type: boolean
        default: True
        description: >
          Remove input-library TSS regions (small RNAs) from the normalized
          bigWig tracks. These regions can confound visual interpretation of
          csRNA-seq signal.
  files:
    type: object
    properties:
      output_dir:
        type: string
        default: "./"
        description: >
          Root directory for all result files: QC tables, BED files,
          quantification matrices, bigWigs, and HOMER tag directories.
      intermediate_dir:
        type: string
        default: "./"
        description: >
          Root directory for intermediate files: trimmed FASTQs, SAI files,
          and sorted BAMs. Can be set to a scratch filesystem to reduce I/O
          load on the main storage.
  qc:
    type: object
    properties:
      organelle_chroms:
        type: array
        items:
          type: string
        default: ["Pt", "Mt"]
        description: >
          List of chromosome names to treat as organellar (non-nuclear).
          Reads mapping to these chromosomes are subtracted from the total
          to compute PctNuclear. For human data use ["chrM"]; for
          Arabidopsis the default ["Pt", "Mt"] is correct. Set to [] to
          skip organelle subtraction.
      mirnas:
        type: string
        default: ""
        description: >
          Path to a BED file of miRNA loci. Used to calculate the miRNA
          depletion ratio (a measure of 5′-phosphate enrichment). Leave
          blank to skip this metric.
      trnas:
        type: string
        default: ""
        description: >
          Path to a BED file of pre-tRNA loci. Used to calculate the
          phosphorylation efficiency metric. Leave blank to skip.
      min_cs_frip:
        type: number
        default: 0.9
        description: >
          Minimum Fraction of Reads in Peaks (FRiP) for a csRNA sample to
          pass QC. FRiP measures what fraction of nuclear reads fall within
          called TSSs; values below ~0.9 suggest a library quality problem.
      min_pct_nuclear:
        type: number
        default: 90
        description: >
          Minimum percentage of aligned reads originating from nuclear
          chromosomes (i.e. not mitochondrial or plastid). Low values
          indicate organellar contamination.
      min_log2_fold:
        type: ["number", "null"]
        default: null
        description: >
          Minimum enrichment threshold a library's TSS calling may use before the
          library fails QC. With an annotation, HOMER chooses this threshold per
          library from the data and writes it to tss/<sample>.stats.txt as
          "log2 fold vs. input"; there is no flag to floor it. On libraries that
          have lost their capped signal it picks values at or below zero, which
          accepts clusters carrying less signal than their own input, and those
          calls then enter the consensus union and are quantified everywhere.
          Null falls back to program/homer/tss/default_log2_fold, on the grounds
          that a data-driven threshold should never be looser than the constant it
          replaced. Set to a number to gate independently of that constant.
      min_cs_frip_final:
        type: ["number", "null"]
        default: null
        description: >
          csFRiP gate for the final QC table, which measures csFRiP against
          tss.final.bed rather than the initial merged TSS set. The two are
          different measurements, so one number cannot serve both: every
          library's csFRiP falls when the consensus set shrinks, and a gate
          tuned on the initial table therefore flags sound libraries in the
          final one. Null falls back to min_cs_frip, which is the behaviour
          before this key existed.
      min_pct_nuclear_final:
        type: ["number", "null"]
        default: null
        description: >
          Nuclear-percentage gate for the final QC table. Null falls back to
          min_pct_nuclear. Nuclear percentage does not depend on the TSS set,
          so this exists for symmetry with min_cs_frip_final rather than
          because the two must differ.
required:
  - program
  - chrom_sizes
  - qc
