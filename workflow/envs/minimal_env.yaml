# Core analysis versions are pinned. These specs are not transitive lockfiles;
# archive a tested environment/container as described in docs/reproducibility.md.
name: csRNAseq
# Channel priority: conda-forge must come before bioconda so that
# conda-forge base packages (compilers, libstdc++) take precedence.
channels:
  - conda-forge
  - bioconda

dependencies:
  # ── Workflow engine ─────────────────────────────────────────────────────────
  - snakemake-minimal =9.13.3
  - pandas =2.3.3

  # ── Alignment & read processing ─────────────────────────────────────────────
  # bwa covers both bwa-aln and bwa-mem modes
  - bwa =0.7.19
  - samtools =1.22.1
  - bedtools =2.31.1
  # Optional: parallel gzip, only needed when use_pigz: True in config
  - pigz

  # ── TSS detection & quantification (HOMER) ──────────────────────────────────
  # Available on Linux via bioconda. macOS users must install HOMER manually:
  #   http://homer.ucsd.edu/homer/introduction/install.html
  - homer =5.1

  # ── R and Bioconductor packages ─────────────────────────────────────────────
  - r-base =4.4.2
  - bioconductor-edger =4.4.0        # TMM normalisation
  - bioconductor-rtracklayer =1.66.0 # BED / bedGraph / bigWig I/O
  - bioconductor-genomicranges =1.58.0 # pulled in by rtracklayer; listed explicitly
  - bioconductor-iranges =2.40.0       # pulled in by GenomicRanges; listed explicitly
  - r-readr =2.1.5                   # fast TSV reading
  - r-data-table >=1.15             # fread in qc_complexity.R

  # ── Not available via conda ─────────────────────────────────────────────────
  # bfqutils (adapter trimming) must be installed manually:
  #   https://github.com/noborilab/bfqutils
# bam2td must also be installed manually: https://github.com/noborilab/bam2td
