### Configuration parameters for the csRNAseq pipeline

sample_table: "config/samples.tsv"

chrom_sizes: "/Users/gok24jef/arabidopsis/ens/chrom.sizes"

genome_fasta: "/Users/gok24jef/arabidopsis/ens/genome.fa"

program:
  # Path to genome index for read alignment
  genome_index: "/Users/gok24jef/arabidopsis/ens/bwa/genome.fa"
  bfqutils:
    # Sequencing adapter for trimming single-end reads
    sequencing_adapter: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
    use_pigz: True
    pigz_threads: 4
  # Number of threads for alignment per sample (will not surpass --cores)
  alignment_threads: 4
  # Alignment program: [bwa-aln, bwa-mem, STAR, bowtie2]
  alignment_program: "bwa-aln"
  # Should trimmed FastQ files be kept?
  keep_trimmed_fastq: True
  # Should BAM files be kept?
  keep_bam: True
  # bwa aln-specific parameters:
  bwa_aln:
    # Should intermediate .sai files be kept?
    keep_sai: True
  bwa_mem:
    # Max gap size:
    w: 0
    # Clipping penalty:
    L: 999
    # Gap open penalty:
    O: 999
  bowtie2:
    extra_params: "--very-sensitive"
  hisat2:
    extra_params: "--very-sensitive --no-spliced-alignment --no-softclip"
  star:
    read_files_command: "zcat"
    align_ends_type: "EndToEnd"
    align_intron_max: 1
    out_filter_multimap_nmax: 1000
    # For small genomes lower this: min(14, floor(log2(genome_size_bp) / 2 - 1))
    # e.g. 12 for Arabidopsis (~135 Mb)
    genome_sa_index_nbases: 14
  homer:
    genome: "tair10"
    tagdir:
      extra_args: "-checkGC"
    tss:
      size: 100
      ntagthreshold: 5
      extra_args: "-includeSingleExons"
      # Optional gene annotation. Without it HOMER cannot pick the enrichment
      # threshold from annotated TSSs vs exons and silently uses default_log2_fold,
      # and the promoter-distal / stable-transcript columns become placeholders.
      # Setting it changes your TSS calls, so compare before adopting.
      gtf: ""
      # findcsRNATSS.pl is a legacy shim for findcsRNATSR.pl. Their output is
      # identical; TSR needs HOMER's bin on PERL5LIB, so the shim stays the default.
      program: "findcsRNATSS.pl"
      # HOMER's own defaults, exposed so they can be tuned. pseudo_count is what lets
      # a cluster with no input coverage pass the enrichment test automatically.
      pseudo_count: 1.0
      default_log2_fold: 1
      local_fold: 2


filtering:
  # Minimum alignment MAPQ:
  alignment_mapq: 30
  include_flags: 0
  exclude_flags: 2308
  # Max read length allowed after merging/trimming:
  max_read_length: 70
  min_alignment_length: 15
  max_mismatch: 999
  tss_min_reps: 1
  # Drop libraries whose initial QC Status is FAIL from the consensus union. The union
  # is a union, so a contaminated library's spurious clusters otherwise enter the
  # shared set. False keeps the historical behaviour; a warning is printed either way.
  exclude_failed_from_consensus: False
  # Read-size composition filters, both gated by tss_srna_min_reads / min_samples.
  # (1) Known small RNA sizes. Drops clusters whose reads sit mostly in the listed
  # lengths. Empty list disables it; for plants use [21, 22, 23, 24, 25], where the
  # 24 nt Pol IV siRNAs over transposons are the main population that survives
  # TEX/AP and gets called as TSSs.
  tss_srna_sizes: []
  tss_max_srna_fraction: 0.5
  # (2) Concentration in the commonest lengths, whatever they are. Real initiation
  # spreads over tens of lengths; a discretely processed RNA does not. Set the
  # fraction below 1 to enable; 0.8 with n = 2 is a good starting point.
  tss_top_sizes_n: 2
  tss_max_top_sizes_fraction: 1
  # top1..top<max> are precomputed, so tss_top_sizes_n can be retuned anywhere in that
  # range without re-reading the tag directories.
  tss_top_sizes_max: 5
  tss_srna_min_reads: 100
  tss_srna_min_samples: 1
  mask_srnas_from_bw: True

files:
  # What is root output folder for results?
  # (QC, BEDs, quantification, TSSs, HOMER tag directories, bedGraphs, bigWigs)
  output_dir: "results"
  # What is the root output folder for intermediate files?
  # (Trimmed FastQ, SAI, BAM)
  intermediate_dir: "results"

qc:
  # Chromosome names treated as organellar (excluded from PctNuclear calculation)
  organelle_chroms: ["Pt", "Mt"]
  mirnas: "/Users/gok24jef/csRNAseq/data/Araport11_miRNA.bed"
  trnas: "/Users/gok24jef/csRNAseq/data/Araport11_pre-tRNA.bed"
  # Stranded BED of snRNA loci, for the snRNA5pPct / tRNA5pPct precision pair.
  snrnas: ""
  min_cs_frip: 0.9
  min_pct_nuclear: 90
